<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字孪生农场</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      #app {
        height: 100%;
      }
      canvas {
        display: block;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .animate-blink {
        animation: blink 1s infinite;
      }
      #nav {
        position: fixed;
        right: 12px;
        top: 12px;
        z-index: 30;
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
        user-select: none;
        max-width: 360px;
        white-space: pre-wrap;
      }

      #controls {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        line-height: 1.4;
        user-select: none;
        width: min(420px, calc(100vw - 24px));
        max-height: 70vh;
        overflow-y: auto;
      }

      #controls .row {
        display: grid;
        grid-template-columns: 90px 1fr 80px;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="controls"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
